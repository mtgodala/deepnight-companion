<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deepnight Companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="preload" href="/static/fonts/Exo2-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/IBMPlexMono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<script>
/* motyw/akcent PRZED malowaniem — bez błysku domyślnego motywu */
document.documentElement.dataset.theme = localStorage.getItem("dn-theme") || "dark";
document.documentElement.dataset.accent = localStorage.getItem("dn-accent") || "blue";
</script>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9.5h18"/></symbol>
  <symbol id="i-pos" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/></symbol>
  <symbol id="i-fuel" viewBox="0 0 24 24"><path d="M12 2.8C9.2 6.4 6.2 9.8 6.2 13.4a5.8 5.8 0 0 0 11.6 0C17.8 9.8 14.8 6.4 12 2.8Z"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8.2 12 3 3 8.2v7.6L12 21l9-5.2V8.2Z"/><path d="M3.4 8.4 12 13.3l8.6-4.9M12 13.3V21"/></symbol>
  <symbol id="i-crew" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c0-3.4 2.8-5.4 6.2-5.4s6.2 2 6.2 5.4"/><circle cx="17.3" cy="9.2" r="2.6"/><path d="M17.6 14.9c2.5.4 4.4 2.1 4.4 4.6"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8.6" cy="8.6" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.4" cy="15.4" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.4" cy="8.6" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="i-gg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6"/><ellipse cx="12" cy="12" rx="10" ry="3.4" transform="rotate(-18 12 12)"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14.5 14.5 0 0 1 0 18M12 3a14.5 14.5 0 0 0 0 18"/></symbol>
  <symbol id="i-half" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none" opacity=".55"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4.5M12 17.2h.01"/></symbol>
  <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
  <symbol id="i-comet" viewBox="0 0 24 24"><circle cx="16.5" cy="16.5" r="4"/><path d="M3 3l8.2 8.2M2.5 9.5 8 15M9.5 2.5 15 8"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="9.2" cy="9.8" r="1.5"/><circle cx="14.4" cy="14.6" r="1"/></symbol>
  <symbol id="i-belt" viewBox="0 0 24 24"><circle cx="5.5" cy="14" r="1.7"/><circle cx="12" cy="10.5" r="2.1"/><circle cx="18.5" cy="14.5" r="1.5"/></symbol>
</defs></svg>
<div id="topbar">
  <span class="brand">RSS DEEPNIGHT REVELATION</span>
  <span id="tb-date" data-i18n-title="tbDateTitle" title="Imperial date">—</span>
  <span id="tb-pos">—</span>
  <span id="tb-fuel" data-i18n-title="tbFuelTitle" title="Fuel — 6,750 t/parsec, full J-4 = 27,000 t">⛽ —</span>
  <span id="tb-su" data-i18n-title="tbSuTitle" title="Supply Units — 1,000 SU/day (B3 p.46)">📦 —</span>
  <span id="tb-crew" data-i18n-title="tbCrewTitle" title="ECEI = CEI+CEIM · morale (MOR) · fatigue (CFI)">👥 —</span>
  <span class="spacer"></span>
  <button id="btn-rolls" class="tab-btn" data-i18n-title="rollsBtnTip" title="Roll history"><svg class="ico"><use href="#i-dice"/></svg></button>
  <button id="btn-theme" class="tab-btn" data-i18n-title="themeTip" title="Theme: dark / paper chart"><svg class="ico"><use href="#i-half"/></svg></button>
  <button id="btn-accent" class="tab-btn" data-i18n-title="accentTip" title="Accent colour">●</button>
  <button id="btn-lang" class="tab-btn" title="Switch language / zmień język">PL</button>
  <button id="btn-undo" class="tab-btn" data-i18n-title="undoTitle" title="Undo the last action (table mistake correction)"><svg class="ico"><use href="#i-undo"/></svg><span data-i18n="undoBtn">undo</span></button>
  <button id="btn-journal" class="tab-btn"><svg class="ico"><use href="#i-book"/></svg><span data-i18n="journalBtn">Log</span></button>
</div>

<div id="init-screen" class="hidden">
  <div class="panel">
    <h2 data-i18n="initTitle">Campaign start</h2>
    <p data-i18n-html="initP">Companion has no ship state yet (<code>state/ship.json</code>).</p>
    <label><span data-i18n="initStart">Starting position:</span>
      <select id="init-start">
        <option value="giikur">Giikur Naval Base (Vland 0211)</option>
        <option value="demnan">Point Demnan (Incognita Citerior 3124)</option>
      </select>
    </label>
    <label><span data-i18n="initDate">Imperial date (DDD-YYYY):</span> <input id="init-date" value="001-1105"></label>
    <label><span data-i18n="initMor">2D3 morale roll (MOR = CEI+2D3, B3 p.38) — empty = computer rolls:</span>
      <input id="init-mor" data-i18n-placeholder="initMorPh" placeholder="e.g. 4"></label>
    <button id="init-go" data-i18n="initGo">Begin</button>
  </div>
</div>

<div id="main" class="hidden">
  <div id="map-col">
    <div id="map-head">
      <select id="sec-select"></select>
      <select id="pin-select" class="hidden"></select>
      <span id="sec-status" class="dim"></span>
      <button id="btn-home" data-i18n="homeBtn" data-i18n-title="homeTitle" title="Return to ship position">to ship</button>
    </div>
    <div id="map-wrap">
      <svg id="hexmap" preserveAspectRatio="xMidYMid meet"></svg>
      <button class="nav-arrow" id="nav-left" title=""><span class="glyph">◀</span><span class="nav-name"></span></button>
      <button class="nav-arrow" id="nav-right" title=""><span class="glyph">▶</span><span class="nav-name"></span></button>
      <button class="nav-arrow" id="nav-up" title=""><span class="glyph">▲</span><span class="nav-name"></span></button>
      <button class="nav-arrow" id="nav-down" title=""><span class="glyph">▼</span><span class="nav-name"></span></button>
      <div id="tooltip" class="hidden"></div>
    </div>
  </div>

  <div id="side-col">
    <div id="ship-panel" class="panel">
      <h3 data-i18n-html="shipPanelH">Ship <span class="dim">(click a stat to edit)</span></h3>
      <div id="stats-grid"></div>
      <div id="defects-box"></div>
      <div id="ship-actions"></div>
      <div id="ship-result" class="dim"></div>
    </div>
    <div id="hex-panel" class="panel">
      <h3 id="hex-title" data-i18n="pickHex">Select a hex</h3>
      <div id="hex-chips"></div>
      <div id="hex-desc"></div>
      <div id="hex-uwp"></div>
      <div id="hex-bodies"></div>
      <div id="hex-detail"></div>
      <div id="hex-actions"></div>
      <div id="action-result" class="dim"></div>
    </div>
  </div>
</div>

<div id="journal-screen" class="hidden">
  <div class="panel">
    <h2><span data-i18n="journalTitle">Ship's log</span> <button id="journal-close" class="tab-btn" data-i18n="journalClose">← map</button></h2>
    <div id="journal-list"></div>
    <div class="journal-add">
      <input id="note-author" data-i18n-placeholder="noteAuthorPh" placeholder="author / character">
      <input id="note-text" data-i18n-placeholder="noteTextPh" placeholder="log entry...">
      <button id="note-add" data-i18n="noteAdd">Add entry</button>
    </div>
  </div>
</div>

<div id="rolls-panel" class="panel hidden">
  <h3 data-i18n="rollsTitle">Roll history</h3>
  <div id="rolls-list"></div>
</div>

<dialog id="dlg">
  <h3 id="dlg-title"></h3>
  <div class="dlg-body" id="dlg-body"></div>
  <div id="dlg-fields"></div>
  <div class="dlg-actions">
    <button id="dlg-cancel" type="button" data-i18n="cancel">Cancel</button>
    <button id="dlg-ok" type="button" class="primary">OK</button>
  </div>
</dialog>

<div id="jump-overlay">
  <div class="streaks"></div>
  <div class="jump-text" data-i18n="jumpText">Jumpspace — 7 days</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
